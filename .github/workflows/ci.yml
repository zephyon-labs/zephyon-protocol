name: Protocol CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate package metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rootPackage = packageLock.packages?.[''];

          if (typeof packageJson.version !== 'string' || packageJson.version.length === 0) {
            throw new Error('package.json must declare a non-empty version');
          }
          if (packageLock.version !== packageJson.version) {
            throw new Error('package-lock.json top-level version does not match package.json');
          }
          if (!rootPackage || rootPackage.version !== packageJson.version) {
            throw new Error('package-lock.json root package version does not match package.json');
          }
          NODE

      - name: Validate release tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            exit 0
          fi

          package_version="$(node -p "require('./package.json').version")"
          tag_name="${GITHUB_REF#refs/tags/}"
          expected_tag="v${package_version}"

          if [[ "$tag_name" != "$expected_tag" ]]; then
            echo "Release tag must exactly match package version: ${expected_tag}" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "Release tag must be annotated" >&2
            exit 1
          fi

          tag_target="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git rev-parse --verify "refs/remotes/origin/main^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$tag_target" refs/remotes/origin/main; then
            echo "Release tag target must be an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run focused CI tests
        run: npm run test:ci

      - name: Validate package exports and contents
        run: |
          test -s dist/index.js
          test -s dist/index.d.ts
          node -e "require('.')"

          pack_report="$(mktemp)"
          trap 'rm -f "$pack_report"' EXIT
          npm pack --dry-run --json > "$pack_report"

          node - "$pack_report" <<'NODE'
          const fs = require('node:fs');

          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(report) || report.length !== 1 || !Array.isArray(report[0].files)) {
            throw new Error('npm pack did not return one machine-readable file list');
          }

          const files = report[0].files.map(({ path }) => path);
          const required = [
            'package.json',
            'README.md',
            'dist/index.js',
            'dist/index.d.ts',
            'docs/devnet-durable-submission-contract.md',
          ];
          for (const path of required) {
            if (!files.includes(path)) {
              throw new Error(`Required package file is missing: ${path}`);
            }
          }

          const rootFiles = new Set([
            'package.json',
            'README.md',
            'docs/devnet-durable-submission-contract.md',
          ]);
          const distSuffixes = ['.js', '.js.map', '.d.ts', '.d.ts.map'];
          const unsafeSegment = (segment) =>
            segment.length === 0 ||
            segment === '.' ||
            segment === '..' ||
            segment.startsWith('.') ||
            segment !== segment.trim() ||
            /[\\\u0000-\u001f\u007f]/.test(segment);
          const allowed = (path) => {
            if (typeof path !== 'string' || path.startsWith('/') || path.includes('\\')) {
              return false;
            }
            if (rootFiles.has(path)) {
              return true;
            }

            const segments = path.split('/');
            if (segments.length < 2 || segments[0] !== 'dist' || segments.some(unsafeSegment)) {
              return false;
            }

            const filename = segments[segments.length - 1];
            return distSuffixes.some((suffix) => filename.endsWith(suffix));
          };

          const positiveCases = [
            'package.json',
            'README.md',
            'docs/devnet-durable-submission-contract.md',
            'dist/index.js',
            'dist/index.js.map',
            'dist/index.d.ts',
            'dist/index.d.ts.map',
            'dist/subdir/module.js',
            'dist/subdir/module.js.map',
            'dist/subdir/module.d.ts',
            'dist/subdir/module.d.ts.map',
          ];
          const negativeCases = [
            '.env',
            '.env.production',
            'dist/.env',
            'dist/.env.production',
            'dist/keys/private-key.pem',
            'dist/private.key',
            'dist/config.json',
            'dist/file.txt',
            'dist/file.ts',
            'dist/file.d.ts.txt',
            'dist/../secret.js',
            '../dist/index.js',
            '/dist/index.js',
            'src/index.js',
            'tests/example.js',
            'programs/example.js',
            '.github/workflows/evil.yml',
            'Anchor.toml',
            'yarn.lock',
            'package-lock.json',
            'LICENSE.env',
            'LICENSE-private-key.pem',
            'CHANGELOG.md',
            'README.secret',
            'distillery/index.js',
            'otherdist/index.js',
          ];
          for (const path of positiveCases) {
            if (!allowed(path)) {
              throw new Error(`Package allowlist rejected positive case: ${path}`);
            }
          }
          for (const path of negativeCases) {
            if (allowed(path)) {
              throw new Error(`Package allowlist accepted negative case: ${path}`);
            }
          }

          const unexpected = files.filter((path) => !allowed(path));
          if (unexpected.length > 0) {
            throw new Error(`Unexpected package files: ${unexpected.join(', ')}`);
          }

          console.log(`Validated ${files.length} package files`);
          NODE
